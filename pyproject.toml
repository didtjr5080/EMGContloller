[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emg-collector"
version = "0.1.0"
description = "ESP32-based EMG dataset collection desktop app (PyQt6)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Pinned: PyQt6 6.11.x ships a Qt6Core.dll that fails to load on this
    # Windows build (WinError 127 "The specified procedure could not be
    # found"). 6.7.x is verified working; re-test before raising the cap.
    "PyQt6>=6.6,<6.8",
    "PyQt6-Qt6>=6.7,<6.8",
    "pyqtgraph>=0.13",
    "pyserial>=3.5",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
]

[project.scripts]
emg-collector = "emg_collector.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
qt_api = "pyqt6"
testpaths = ["tests"]
